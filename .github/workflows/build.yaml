on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04-arm
    env:
      # A fork's GITHUB_TOKEN can only push to its own GHCR namespace, not the
      # Makefile's default (talos-rpi5). An inherited env var overrides `?=`.
      REGISTRY_USERNAME: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: imjasonh/setup-crane@v0.4
        with:
          version: v0.20.5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up GitHub Actions bot user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare (checkouts & patches)
        run: make checkouts patches

      - name: Kernel
        run: make kernel

      - name: Overlay
        run: make overlay

      - name: Installer
        run: make installer

      - name: Netboot assets
        run: make netboot

      - name: Generate iPXE script
        run: |
          set -euo pipefail
          OUT=./checkouts/talos/_out/netboot

          # Each kind's directory holds one file; its name depends on the profile.
          KERNEL_FILE=$(basename "$(ls "$OUT"/kernel/*)")
          INITRAMFS_FILE=$(basename "$(ls "$OUT"/initramfs/*)")
          CMDLINE_FILE=$(ls "$OUT"/cmdline/*)

          KERNEL_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$KERNEL_FILE"
          INITRAMFS_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$INITRAMFS_FILE"
          CMDLINE=$(cat "$CMDLINE_FILE")

          # Static equivalent of image-factory's standard.ipxe.
          cat > "$OUT/boot.ipxe" <<IPXE
          #!ipxe

          imgfree
          kernel $KERNEL_URL $CMDLINE
          initrd $INITRAMFS_URL
          boot
          IPXE

          echo "KERNEL_PATH=$OUT/kernel/$KERNEL_FILE" >> "$GITHUB_ENV"
          echo "INITRAMFS_PATH=$OUT/initramfs/$INITRAMFS_FILE" >> "$GITHUB_ENV"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLACE_EXISTING_RELEASE: ${{ vars.REPLACE_EXISTING_RELEASE }}
        run: |
          NOTES=$(cat <<EOF
          > ⚠️ Experimental build, use at your own risk.

          This is a patched version of Talos tailored for the Raspberry Pi 5, including NVMe, NIC and USB support.

          ### What's available

          - 📦 **Raw disk image** (\`metal-arm64.raw.xz\`) for fresh installs
          - ⚙️ **Installer image** (\`ghcr.io/${{ github.repository_owner }}/installer:${{ github.ref_name }}\`) for upgrades
          - 🌐 **Netboot assets** (kernel, initramfs, \`boot.ipxe\`) -- point a DHCP/PXE server's boot option (or an \`ipxe chain\`) at this release's \`boot.ipxe\` asset URL to netboot straight into Talos maintenance mode, the same way \`pxe.factory.talos.dev\` does for an official schematic. Generated the same way Image Factory's own PXE frontend does (\`imager --output-kind=kernel/initramfs/cmdline\`), just as static assets on this release instead of rendered per-request.

          ### Install

          - **Fresh install**
            - Download the raw disk image from this release
            - Decompress (\`xz -d metal-arm64.raw.xz\`) and flash with \`dd\`, or flash the \`.xz\` directly with Raspberry Pi Imager / balenaEtcher

          - **Netboot**
            - Point your PXE/iPXE setup at this release's \`boot.ipxe\` asset (e.g. \`chain --replace https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/boot.ipxe\`)
            - Boots into Talos maintenance mode; apply a machine config the normal way (e.g. \`talosctl apply-config\`) to finish

          - **Upgrade existing node**
            \`\`\`bash
            talosctl upgrade --nodes <NODE_IP> --image ghcr.io/${{ github.repository_owner }}/installer:${{ github.ref_name }}
            \`\`\`

          EOF
          )
          # Opt-in (repo variable REPLACE_EXISTING_RELEASE=true), e.g. for forks.
          # Off by default: published releases should stay immutable.
          if [ "${REPLACE_EXISTING_RELEASE:-false}" = true ] && gh release view ${{ github.ref_name }} >/dev/null 2>&1; then
            gh release delete ${{ github.ref_name }} --yes --cleanup-tag=false
          fi
          gh release create \
            ${{ github.ref_name }} \
            ./checkouts/talos/_out/metal-arm64.raw.xz \
            "$KERNEL_PATH" \
            "$INITRAMFS_PATH" \
            ./checkouts/talos/_out/netboot/boot.ipxe \
            --title "${{ github.ref_name }}" \
            --notes "$NOTES"
